name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

concurrency:
  group: publish-typescript-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install supported npm publisher
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$REQUESTED_VERSION"

      - name: Build and inspect package
        run: |
          npm test
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
