name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

concurrency:
  group: publish-typescript-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Install supported npm publisher
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: test "$(node -p 'require("./package.json").version')" = "$REQUESTED_VERSION"

      - name: Build and inspect package
        run: |
          npm run build
          npm test -- --runInBand --passWithNoTests
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
