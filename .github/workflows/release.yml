name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      channel:
        description: npm distribution tag (prereleases must use next)
        required: true
        default: next
        type: choice
        options: [next, latest]

concurrency:
  group: publish-typescript-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install supported npm publisher
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          node --input-type=commonjs <<'NODE'
          const p = require('./package.json');
          const v = process.env.REQUESTED_VERSION;
          const tag = process.env.RELEASE_CHANNEL;
          if (!/^\d+\.\d+\.\d+(?:-rc\.\d+)?$/.test(v) || v !== p.version)
            throw new Error('Exact supported release version required');
          if (!['next', 'latest'].includes(tag) || (v.includes('-') && tag !== 'next'))
            throw new Error('Prereleases cannot replace the stable channel');
          if (p.publishConfig?.tag && p.publishConfig.tag !== tag)
            throw new Error('Channel differs from reviewed package metadata');
          NODE

      - name: Build and inspect package
        run: |
          npm test
          npm audit --omit=dev --audit-level=high
          npm pack --dry-run

      - name: Publish to npm with provenance
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: npm publish --access public --provenance --tag "$RELEASE_CHANNEL"
